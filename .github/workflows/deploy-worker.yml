name: Deploy Quran Reader sync Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, closed]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'deploy-sync-production' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-worker-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCOUNT_ID: d2c3c656cbf2f4e32a133ab2fa3dcd5a
    steps:
      - name: Check out the exact production revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify maintainer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node worker/scripts/deployment.js authorize

      - name: Validate the exact revision before production changes
        run: |
          npm run check
          npm --prefix worker run check
          npm test

      - name: Verify permissions and preserve the existing Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node worker/scripts/deployment.js prepare

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.158.0"
          workingDirectory: worker
          command: deploy

      - name: Verify production identity, health, and sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node worker/scripts/deployment.js verify

      - name: Remove private canary credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sync-production-state.json"

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Find the current Worker name
        id: worker
        env:
          ACCOUNT_ID: d2c3c656cbf2f4e32a133ab2fa3dcd5a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node worker/scripts/deployment.js find

      - name: Deploy isolated Worker preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.158.0"
          workingDirectory: worker
          command: preview --name pr-${{ github.event.pull_request.number }} --worker-name ${{ steps.worker.outputs.name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add preview URL to the job summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          echo "### Cloudflare Worker preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request deployment helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Find the current Worker name
        id: worker
        env:
          ACCOUNT_ID: d2c3c656cbf2f4e32a133ab2fa3dcd5a
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node worker/scripts/deployment.js find

      - name: Delete the pull request preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.158.0"
          workingDirectory: worker
          command: preview delete --name pr-${{ github.event.pull_request.number }} --worker-name ${{ steps.worker.outputs.name }} --skip-confirmation
